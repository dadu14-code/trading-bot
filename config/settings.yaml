# Universo: le crypto girano 24/7, gli ETF solo a mercato USA aperto.
universe:
  crypto: ["BTC/USD", "ETH/USD", "SOL/USD"]
  stocks: ["SPY", "QQQ", "GLD"]

timeframes:            # analisi temporale multi-orizzonte
  long: "1Day"         # tendenza primaria (mesi)
  medium: "4Hour"      # tendenza intermedia (settimane)
  short: "1Hour"       # timing d'ingresso (giorni)

risk:
  risk_per_trade_pct: 0.75     # % equity rischiata tra ingresso e stop
  max_position_pct: 20         # peso massimo di un singolo asset
  max_total_exposure_pct: 80   # esposizione lorda massima
  max_crypto_exposure_pct: 40  # le crypto sono correlate: tetto di cluster
  max_open_positions: 5
  atr_stop_mult: 2.0           # stop iniziale = ingresso - 2*ATR(4H)
  atr_trail_mult: 3.0          # trailing chandelier = max dal'ingresso - 3*ATR(4H)
  time_stop_bars_4h: 30        # ~5 giorni senza progressi → esci
  # Circuit breaker (ispirato a drawdown-circuit-breaker)
  daily_loss_halt_pct: 3.0     # stop nuovi ingressi per oggi
  weekly_loss_derisk_pct: 6.0  # dimezza il rischio
  max_drawdown_kill_pct: 15.0  # chiude tutto e mette in pausa
  losing_streak_cooldown: 3    # N perdite di fila → pausa sui nuovi ingressi…
  losing_streak_cooldown_hours: 8   # …per 8 ore
  # Volatility targeting: se il portafoglio oscilla più del target, il rischio scala giù
  target_portfolio_vol: 0.25   # 25% annualizzato
  # Stop di emergenza lato broker: protegge se il PC/VPS si spegne o il prezzo crolla di colpo
  broker_backup_stop: true
  backup_stop_extra_atr: 1.0   # piazzato 1 ATR sotto lo stop software

signals:
  entry_threshold: 0.55        # punteggio composito minimo (0..1) per entrare
  weights: {long: 0.30, medium: 0.25, trigger: 0.20, analog: 0.25}
  analog_k: 40                 # n. situazioni storiche più simili da confrontare
  analog_horizon_bars: 24      # orizzonte di uscita delle analogie (barre 1H)
  analog_min_winrate: 0.52

# SHORT sugli ETF (Alpaca non permette short sulle crypto). Vende i rimbalzi falliti
# in trend ribassista; serve il bias "short" esplicito del bot Strategia.
shorts:
  enabled: true
  symbols: ["SPY", "QQQ", "GLD"]
  risk_mult: 0.75            # gli short rischiano squeeze: size ridotta del 25%
  entry_threshold: 0.58
  atr_stop_mult: 2.0
  atr_trail_mult: 2.5
  max_stretch_atr: 3.0       # niente short se il prezzo è già >3 ATR sotto la media 4H

# RIMBALZO da capitolazione: crollo esteso + volume climax + prima inversione.
# Opera anche contro il trend primario, quindi rischio piccolo e uscita rapida.
capitulation:
  enabled: true
  risk_pct: 0.25             # % equity rischiata (un terzo di un trade normale)
  max_open: 1                # al massimo un rimbalzo aperto alla volta
  min_score: 0.85
  max_fear_greed: 20         # crypto: serve paura estrema
  stop_buffer_atr: 0.5       # stop sotto il minimo della capitolazione
  target_r: 1.5              # obiettivo: +1,5 volte il rischio
  time_stop_bars_4h: 12      # 2 giorni al massimo
  cooldown_hours: 48         # dopo un rimbalzo, niente altri sullo stesso asset per 48h

macro:
  # Nessun nuovo ingresso a ridosso di eventi USA ad alto impatto (FOMC, CPI, NFP…)
  blackout_before_min: 120
  blackout_after_min: 60
  currencies: ["USD"]

# Strategie "ombra": girano in parallelo SOLO in simulazione sugli stessi dati.
# Il report settimanale le confronta con quella reale: se una batte stabilmente
# la principale, la si promuove copiandone i parametri sopra.
shadow_variants:
  prudente:   {signals: {entry_threshold: 0.62}, risk: {atr_stop_mult: 2.5}}
  aggressiva: {signals: {entry_threshold: 0.50, analog_min_winrate: 0.50}}
  trend_lungo: {risk: {atr_trail_mult: 4.0, time_stop_bars_4h: 60}}

# Ottimizzazione settimanale automatica (bot optimizer). NON applica nulla da sola.
optimization:
  day: "sun"
  hour: 4                    # domenica alle 04:00, pronta per il report delle 19:00
  history_days: 730          # 2 anni di dati orari
  folds: 4
  min_gain_r: 3.0            # i suggeriti vanno consigliati solo se battono gli attuali di almeno 3R…
  min_trades: 20             # …su almeno 20 operazioni fuori campione

schedule:
  trader_every_minutes: 5
  strategist_every_hours: 4
  rereview_move_pct: 3.0      # rivaluta subito se un asset si muove più del 3% dall'ultima analisi
  morning_report: "08:00"      # "cosa sto facendo / piano di oggi"
  evening_report: "21:30"      # "cosa ho fatto oggi"
  weekly_report_day: "sun"
